tagline: A home away from home for University of Dhaka graduates across the Great Lakes State.
intro: >-
  DUAA Michigan is a community for graduates of the University of Dhaka who
  have made Michigan their home. From Detroit to Ann Arbor, Lansing to Grand
  Rapids, we gather to share memories of campus, support one another, and pass
  our heritage on to the next generation.
