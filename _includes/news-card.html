{% assign p = include.post %}
<article class="card news-card">
  <a class="news-image" href="{{ p.url | relative_url }}" tabindex="-1" aria-hidden="true">
    {% if p.image and p.image != "" %}
      <img src="{{ p.image | relative_url }}" alt="" loading="lazy">
    {% else %}
      <img class="placeholder" src="{{ '/assets/images/logo-256.jpg' | relative_url }}" alt="" loading="lazy">
    {% endif %}
  </a>
  <div class="news-body">
    <p class="news-date">{{ p.date | date: "%B %-d, %Y" }}</p>
    <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    <p>{{ p.summary | default: p.excerpt | strip_html | truncatewords: 30 }}</p>
    <a class="text-link" href="{{ p.url | relative_url }}">Read more &rarr;</a>
  </div>
</article>
